name: Six Eyes CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-to-pi:
    runs-on: self-hosted
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Pull and Redeploy Containers
        run: |
          docker compose down
          docker compose up --build -d
          docker system prune -f
